<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>DJ Library</title>
  <link rel="stylesheet" href="/static/style.css">
  <script defer src="/static/alpine.min.js"></script>
  <script src="/config.js"></script>
</head>
<body>
  <main x-data="library()" x-init="load()">
    <header class="hero">
      <div class="logo" aria-label="DJ Library logo">DJ</div>
      <div><p class="eyebrow">LOCAL MUSIC LIBRARY</p><h1>DJ Library</h1><p class="muted">Browse your collection and generate a predictable AutoDJ playlist.</p></div>
    </header>
    <section class="panel controls">
      <label>Search <input x-model="filters.search" @input.debounce.300ms="load(true)" placeholder="Title, artist, path or genre"></label>
      <label>Genre <input x-model="filters.genre" @input.debounce.300ms="load(true)" placeholder="House"></label>
      <label>Page size <input type="number" min="1" max="100" x-model.number="filters.pageSize" @change="load()"></label>
    </section>
    <section class="layout">
      <div class="panel">
        <div class="section-heading"><h2>Tracks</h2><span x-text="total + ' tracks'"></span></div>
        <p class="error" x-show="error" x-text="error"></p>
        <div class="track-list">
          <template x-for="track in tracks" :key="track.id">
            <article class="track">
              <div><strong x-text="track.title"></strong><span class="muted" x-text="track.artist + (track.genre ? ' · ' + track.genre : '')"></span></div>
              <span class="pill" x-text="track.bpm ? track.bpm + ' BPM' : '— BPM'"></span>
            </article>
          </template>
          <p class="muted" x-show="!loading && tracks.length === 0">No tracks found.</p>
        </div>
      </div>
      <form class="panel autodj" @submit.prevent="generate()">
        <h2>AutoDJ</h2>
        <p class="muted">Choose a target; closest BPM, key and genre are selected deterministically.</p>
        <label>BPM <input type="number" min="1" max="400" x-model.number="auto.bpm"></label>
        <label>Key <input x-model="auto.key" placeholder="F# min"></label>
        <label>Genre <input x-model="auto.genre" placeholder="House"></label>
        <label>Tracks <input type="number" min="1" max="200" x-model.number="auto.limit"></label>
        <button type="submit">Generate playlist</button>
        <button type="button" class="download" x-show="playlist.length" x-text="downloading ? 'Downloading…' : 'Download M3U8'" :disabled="downloading" @click="downloadM3u8()"></button>
        <ol><template x-for="track in playlist" :key="track.id"><li x-text="track.artist + ' — ' + track.title"></li></template></ol>
      </form>
    </section>
  </main>
  <script>
    function library() {
      return {
        tracks: [], playlist: [], total: 0, loading: false, downloading: false, error: '', filters: { page: 1, pageSize: 20, search: '', genre: '' },
        auto: { bpm: 124, key: '', genre: '', limit: 10 },
        get apiBase() { const configured = window.__DJ_LIBRARY_CONFIG__?.API_BASE_URL || ''; return configured && configured.replace(/\/$/, '') !== window.location.origin ? configured.replace(/\/$/, '') : ''; },
        // Builds a query string that omits empty/undefined/NaN values, so optional
        // fields (e.g. key, genre) are sent as *absent* instead of an empty string.
        // Sending "key=" would fail backend validation, which allows a missing key
        // but rejects an explicit empty one.
        buildQuery(params) {
          const query = new URLSearchParams();
          for (const [key, value] of Object.entries(params)) {
            if (value === null || value === undefined) continue;
            if (typeof value === 'number' && Number.isNaN(value)) continue;
            if (value === '') continue;
            query.set(key, value);
          }
          return query;
        },
        get m3uUrl() { return this.apiBase + '/api/v1/autodj/playlist.m3u8?' + this.buildQuery(this.auto); },
        // Fetches the M3U8 as a Blob and triggers the download via a same-origin
        // blob: URL. A plain <a download href="cross-origin-url"> is ignored by
        // browsers (the download attribute only applies to same-origin URLs), so
        // when API_BASE_URL points elsewhere the browser would navigate to the
        // file instead of downloading it — which looks like a blocked download.
        async downloadM3u8() {
          this.downloading = true; this.error = '';
          try {
            const response = await fetch(this.m3uUrl);
            if (!response.ok) {
              const body = await response.json().catch(() => null);
              throw new Error(body?.error?.message || body?.message || `Playlist download failed (HTTP ${response.status})`);
            }
            const blob = await response.blob();
            const objectUrl = URL.createObjectURL(blob);
            const link = document.createElement('a');
            link.href = objectUrl;
            link.download = 'autodj.m3u8';
            document.body.appendChild(link);
            link.click();
            link.remove();
            setTimeout(() => URL.revokeObjectURL(objectUrl), 1000);
          } catch (error) {
            this.error = error instanceof Error ? error.message : 'Could not download playlist';
          } finally { this.downloading = false; }
        },
        async load(resetPage = false) {
          this.loading = true; this.error = '';
          try {
            if (resetPage) this.filters.page = 1;
            const query = this.buildQuery(this.filters);
            const response = await fetch(this.apiBase + '/api/v1/tracks?' + query);
            const body = await response.json().catch(() => null);
            if (!response.ok) {
              const details = Array.isArray(body?.error?.details) ? `: ${body.error.details.map(detail => detail.message).join(', ')}` : '';
              const message = (body?.error?.message || body?.message || `Track request failed (HTTP ${response.status})`) + details;
              throw new Error(message);
            }
            const tracks = Array.isArray(body)
              ? body
              : Array.isArray(body?.data) ? body.data
              : Array.isArray(body?.tracks) ? body.tracks
              : Array.isArray(body?.results) ? body.results
              : Array.isArray(body?.data?.tracks) ? body.data.tracks
              : null;
            if (!Array.isArray(tracks)) throw new Error('The API returned an unexpected track-list response.');
            this.tracks = tracks;
            this.total = Number.isFinite(body?.pagination?.total)
              ? body.pagination.total
              : Number.isFinite(body?.total) ? body.total : tracks.length;
          } catch (error) {
            this.tracks = []; this.total = 0; this.error = error instanceof Error ? error.message : 'Could not load tracks';
          } finally { this.loading = false; }
        },
        async generate() {
          const query = this.buildQuery(this.auto);
          try {
            const response = await fetch(this.apiBase + '/api/v1/autodj/playlist?' + query);
            const body = await response.json().catch(() => ({}));
            if (!response.ok) throw new Error(body.error?.message || body.message || 'Could not generate playlist');
            this.playlist = Array.isArray(body.data) ? body.data : [];
            if (!Array.isArray(body.data)) this.error = 'The API returned an unexpected playlist response.';
          } catch (error) { this.playlist = []; this.error = error instanceof Error ? error.message : 'Could not generate playlist'; }
        }
      };
    }
  </script>
</body>
</html>
